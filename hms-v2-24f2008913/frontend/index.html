<!doctype html>
{% raw %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HMS V2 (build 2026-04-08.1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --hms-bg-a: #f3f8ff;
      --hms-bg-b: #e8f4ec;
      --hms-ink: #1c2536;
      --hms-card: rgba(255, 255, 255, 0.94);
      --hms-line: rgba(13, 110, 253, 0.12);
    }

    body.app-body {
      font-family: "Space Grotesk", sans-serif;
      color: var(--hms-ink);
      min-height: 100vh;
      background:
        radial-gradient(1200px 500px at 10% -10%, #dbeafe 20%, transparent 60%),
        radial-gradient(800px 400px at 100% 0%, #dcfce7 15%, transparent 60%),
        linear-gradient(160deg, var(--hms-bg-a), var(--hms-bg-b));
    }

    .app-shell { max-width: 1240px; }

    .hero-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .hero-copy h1 { margin: 0; font-weight: 700; letter-spacing: 0.3px; }
    .hero-copy p { margin: 0.25rem 0 0; color: #5f6b7a; }

    .soft-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      background: rgba(13, 110, 253, 0.08);
      color: #0d6efd;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .card {
      background: var(--hms-card);
      border: 1px solid var(--hms-line);
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.08);
      border-radius: 16px;
    }

    .section-card { border: 0; overflow: hidden; }
    .section-card .card-body { padding: 1.25rem; }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .section-title { font-size: 1rem; font-weight: 700; margin: 0; }
    .section-subtitle { color: #5f6b7a; font-size: 0.88rem; margin: 0.15rem 0 0; }

    .dashboard-grid { display: grid; gap: 1rem; }
    .dashboard-grid.two-col { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dashboard-grid.three-col { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .stat-card .card-body { padding: 1rem 1.1rem; }
    .stat-label { color: #5f6b7a; font-size: 0.85rem; margin-bottom: 0.2rem; }

    .btn { border-radius: 10px; font-weight: 600; }
    .btn-sm { border-radius: 9px; padding-inline: 0.7rem; }
    .btn-primary { background: linear-gradient(90deg, #1678ff, #0d6efd); border: none; }
    .btn-outline-primary,
    .btn-outline-secondary,
    .btn-outline-danger,
    .btn-outline-warning,
    .btn-outline-success { border-width: 1.5px; }

    .compact-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .auth-wrap { margin-top: 0.8rem; }
    .auth-stage {
      max-width: 1040px;
      margin: 0 auto;
      min-height: calc(100vh - 210px);
      display: flex;
      align-items: center;
    }
    .auth-grid {
      display: grid;
      grid-template-columns: minmax(300px, 0.9fr) minmax(400px, 1.1fr);
      gap: 1rem;
      align-items: center;
      width: 100%;
    }

    .auth-side {
      border: 0;
      background:
        linear-gradient(165deg, rgba(15, 23, 42, 0.92), rgba(30, 64, 175, 0.88)),
        radial-gradient(500px 250px at 100% -20%, rgba(110, 231, 183, 0.25), transparent 60%);
      color: #e8f1ff;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.2);
    }

    .auth-side .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      height: 100%;
    }

    .auth-side h2 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .auth-side p {
      margin: 0;
      color: rgba(232, 241, 255, 0.84);
      line-height: 1.45;
    }

    .auth-role-list {
      display: grid;
      gap: 0.55rem;
    }

    .auth-role-item {
      border-radius: 11px;
      border: 1px solid rgba(191, 219, 254, 0.28);
      background: rgba(15, 23, 42, 0.28);
      padding: 0.6rem 0.75rem;
    }

    .auth-role-item strong {
      display: block;
      font-size: 0.87rem;
      margin-bottom: 0.12rem;
      color: #ffffff;
    }

    .auth-role-item span {
      font-size: 0.8rem;
      color: rgba(232, 241, 255, 0.84);
    }

    .auth-card { border: 0; box-shadow: 0 18px 38px rgba(15, 23, 42, 0.16); }
    .auth-main .card-body { padding: 1.35rem 1.5rem; }
    .auth-main { min-height: 360px; display: flex; align-items: center; }
    .auth-card .form-control,
    .auth-card .form-select { border-radius: 10px; padding: 0.72rem 0.85rem; }
    .auth-title { margin: 0 0 0.25rem; font-size: 1.55rem; font-weight: 700; }
    .auth-subtitle { margin: 0 0 1rem; color: #667487; font-size: 0.9rem; }

    .availability-row {
      padding: 0.9rem;
      border: 1px solid var(--hms-line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.72);
      margin-bottom: 0.85rem;
    }

    .availability-row .row-label {
      font-size: 0.86rem;
      font-weight: 700;
      color: #38506b;
      margin-bottom: 0.55rem;
    }

    .doctor-card {
      border: 1px solid var(--hms-line);
      border-radius: 16px;
      background: #fff;
      height: 100%;
    }

    .doctor-card .card-body { display: flex; flex-direction: column; gap: 0.85rem; }
    .doctor-name { font-size: 1rem; font-weight: 700; margin-bottom: 0.15rem; }
    .doctor-subtle { color: #5f6b7a; font-size: 0.86rem; }

    .availability-list {
      border-radius: 12px;
      background: #f8fbff;
      border: 1px solid rgba(13, 110, 253, 0.09);
      padding: 0.75rem;
      max-height: 112px;
      overflow-y: auto;
    }

    .patient-quick-nav {
      position: sticky;
      top: 8px;
      z-index: 5;
      backdrop-filter: blur(2px);
    }

    .doctor-summary {
      border-radius: 14px;
      background: rgba(13, 110, 253, 0.06);
      border: 1px solid rgba(13, 110, 253, 0.1);
      padding: 0.9rem 1rem;
    }

    .table { font-size: 0.95rem; }

    .export-status {
      border-radius: 12px;
      border: 1px solid var(--hms-line);
      background: #f8fbff;
      padding: 0.75rem 0.9rem;
    }

    .export-state-badge {
      font-size: 0.74rem;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }

    @media (max-width: 1100px) {
      .auth-stage { min-height: auto; }
      .auth-grid { grid-template-columns: 1fr; }
      .auth-side { order: 2; }
      .auth-main { order: 1; }
    }

    @media (max-width: 768px) {
      .auth-wrap { margin-top: 0.5rem; }
      .auth-side .card-body { padding: 1rem; }
      .auth-main .card-body { padding: 1rem; }
      .auth-main { min-height: auto; }
      .dashboard-grid.two-col,
      .dashboard-grid.three-col { grid-template-columns: 1fr; }
      .hero-bar { align-items: flex-start; }
    }
  </style>
</head>
<body class="app-body">
  <div id="app" class="container py-4 app-shell">
    <div class="hero-bar">
      <div class="hero-copy">
        <h1 class="h2">Hospital Management System V2</h1>
        <p>Admin, doctor, and patient workflows in one clean dashboard. Build: 2026-04-08.1</p>
      </div>
      <div v-if="state.user" class="d-flex align-items-center gap-2 flex-wrap justify-content-end">
        <span class="soft-chip text-uppercase">{{ state.user.role }}</span>
        <button class="btn btn-sm btn-outline-danger" @click="logout">Logout</button>
      </div>
    </div>

    <div v-if="state.error" class="alert alert-danger">{{ state.error }}</div>
    <div v-if="state.info" class="alert alert-info">{{ state.info }}</div>

    <component
      :is="currentComponent"
      :state="state"
      :api="api"
      @login="onLogin"
      @register="registerPatient"
      @load-admin="loadAdminData"
      @load-doctor="loadDoctorData"
      @load-patient="loadPatientData"
      @api="api"
    ></component>
  </div>

  <script type="text/x-template" id="login-template">
    <div class="auth-stage auth-wrap">
      <div class="auth-grid">
        <div class="card auth-side">
          <div class="card-body">
            <div>
              <h2>Welcome to HMS</h2>
              <p>Single system for appointment booking, treatment tracking, and role-based workflows.</p>
            </div>
            <div class="auth-role-list">
              <div class="auth-role-item"><strong>Admin Access</strong><span>Manage doctors, patients, appointments, and availability.</span></div>
              <div class="auth-role-item"><strong>Doctor Access</strong><span>Manage schedules, update treatment notes, and review patient history.</span></div>
              <div class="auth-role-item"><strong>Patient Access</strong><span>Book appointments, upload reports, and export your treatment records.</span></div>
            </div>
            <p class="small">Use your username or email to sign in.</p>
          </div>
        </div>

        <div class="card auth-card auth-main">
          <div class="card-body">
            <h2 class="auth-title">Login</h2>
            <p class="auth-subtitle">Continue to your dashboard.</p>
            <div class="mb-3">
              <label class="form-label">Username or Email</label>
              <input v-model="form.username" class="form-control" placeholder="Enter username or email" />
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input v-model="form.password" type="password" class="form-control" placeholder="Enter password" />
            </div>
            <button class="btn btn-primary w-100" @click="submit">Login</button>
            <button class="btn btn-link w-100 mt-2" @click="$emit('register')">New patient? Register</button>
          </div>
        </div>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="register-template">
    <div class="auth-stage auth-wrap">
      <div class="auth-grid">
        <div class="card auth-side">
          <div class="card-body">
            <div>
              <h2>Patient Registration</h2>
              <p>Create your account to book appointments, view treatment history, and download reports anytime.</p>
            </div>
            <div class="auth-role-list">
              <div class="auth-role-item"><strong>Fast Booking</strong><span>Find doctors by date, specialization, and open slot.</span></div>
              <div class="auth-role-item"><strong>Medical Documents</strong><span>Upload and download your reports securely.</span></div>
              <div class="auth-role-item"><strong>CSV Export</strong><span>Get treatment-backed records in one click.</span></div>
            </div>
            <p class="small">All fields can be updated later from the patient dashboard.</p>
          </div>
        </div>

        <div class="card auth-card auth-main">
          <div class="card-body">
            <h2 class="auth-title">Create Account</h2>
            <p class="auth-subtitle">Register as a patient.</p>
            <div class="row g-2">
              <div class="col-md-6"><input v-model="form.username" class="form-control" placeholder="Username" /></div>
              <div class="col-md-6"><input v-model="form.email" class="form-control" placeholder="Email" /></div>
              <div class="col-md-6"><input v-model="form.password" type="password" class="form-control" placeholder="Password" /></div>
              <div class="col-md-6"><input v-model="form.name" class="form-control" placeholder="Full Name" /></div>
              <div class="col-md-6"><input v-model="form.contact" class="form-control" placeholder="Contact" /></div>
              <div class="col-md-6"><input v-model="form.date_of_birth" type="date" class="form-control" /></div>
              <div class="col-12"><input v-model="form.address" class="form-control" placeholder="Address" /></div>
            </div>
            <div class="compact-actions mt-3">
              <button class="btn btn-success" @click="submit">Register</button>
              <button class="btn btn-link" @click="$emit('register')">Back to login</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="admin-template">
    <div>
      <div class="section-header">
        <div>
          <h2 class="section-title">Admin Dashboard</h2>
          <p class="section-subtitle">Manage doctors, patients, appointments, and search the registry.</p>
        </div>
      </div>

      <div class="dashboard-grid three-col mb-3">
        <div class="card section-card stat-card"><div class="card-body"><div class="stat-label">Doctors</div><p class="display-6 mb-0">{{ state.admin.summary.total_doctors || 0 }}</p></div></div>
        <div class="card section-card stat-card"><div class="card-body"><div class="stat-label">Patients</div><p class="display-6 mb-0">{{ state.admin.summary.total_patients || 0 }}</p></div></div>
        <div class="card section-card stat-card"><div class="card-body"><div class="stat-label">Appointments</div><p class="display-6 mb-0">{{ state.admin.summary.total_appointments || 0 }}</p></div></div>
      </div>

      <div class="card section-card mb-3">
        <div class="card-body">
          <div class="section-header">
            <div>
              <h3 class="section-title">{{ editingDoctorId ? 'Edit Doctor' : 'Add Doctor' }}</h3>
              <p class="section-subtitle">{{ editingDoctorId ? 'Update the selected doctor profile.' : 'Create login credentials and profile details together.' }}</p>
            </div>
            <span class="soft-chip">Admin action</span>
          </div>
          <div class="dashboard-grid two-col">
            <input v-model="doctorForm.name" class="form-control" placeholder="Name" />
            <input v-model="doctorForm.email" class="form-control" placeholder="Email" :disabled="editingDoctorId !== null" />
            <input v-model="doctorForm.temp_password" class="form-control" placeholder="Temp Password" :disabled="editingDoctorId !== null" />
            <input v-model="doctorForm.specialization" class="form-control" placeholder="Specialization" />
            <input v-model.number="doctorForm.experience_years" type="number" class="form-control" placeholder="Experience Years" />
            <select v-model.number="doctorForm.department_id" class="form-select">
              <option :value="null">Department</option>
              <option v-for="d in state.admin.departments" :key="d.id" :value="d.id">{{ d.name }}</option>
            </select>
            <textarea v-model="doctorForm.bio" class="form-control" placeholder="Bio"></textarea>
          </div>
          <div class="compact-actions mt-3">
            <button class="btn btn-primary" @click="addDoctor">{{ editingDoctorId ? 'Update Doctor' : 'Add Doctor' }}</button>
            <button class="btn btn-outline-secondary" @click="resetDoctorForm">{{ editingDoctorId ? 'Cancel Edit' : 'Clear Form' }}</button>
          </div>
        </div>
      </div>

      <div class="card section-card mb-3">
        <div class="card-body">
          <div class="section-header">
            <div>
              <h3 class="section-title">Search</h3>
              <p class="section-subtitle">Search doctors by name/specialization and patients by name, ID, or contact.</p>
            </div>
          </div>
          <div class="input-group mb-2">
            <input v-model="search.q" class="form-control" placeholder="Search doctor/patient" />
            <select v-model="search.type" class="form-select" style="max-width:160px">
              <option value="both">Both</option>
              <option value="doctor">Doctor</option>
              <option value="patient">Patient</option>
            </select>
            <button class="btn btn-outline-primary" @click="searchEntity">Search</button>
          </div>
          <ul class="list-group" v-if="state.admin.searchResults.length">
            <li class="list-group-item" v-for="r in state.admin.searchResults" :key="r.type + '-' + r.id">
              <strong>{{ r.type }}</strong> - {{ r.name }}
            </li>
          </ul>
        </div>
      </div>

      <div class="card section-card mb-3">
        <div class="card-body table-responsive">
          <div class="section-header">
            <div>
              <h3 class="section-title">Doctors</h3>
              <p class="section-subtitle">Edit or blacklist doctor accounts.</p>
            </div>
          </div>
          <table class="table table-sm table-bordered align-middle">
            <thead><tr><th>Name</th><th>Email</th><th>Specialization</th><th>Department</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              <tr v-for="d in state.admin.doctors" :key="d.id">
                <td>{{ d.name }}</td><td>{{ d.email }}</td><td>{{ d.specialization }}</td><td>{{ d.department }}</td>
                <td><span class="badge" :class="d.is_active ? 'text-bg-success' : 'text-bg-secondary'">{{ d.is_active ? 'Active' : 'Blacklisted' }}</span></td>
                <td>
                  <div class="compact-actions">
                    <button class="btn btn-sm btn-outline-warning" @click="startEditDoctor(d)">Edit</button>
                    <button class="btn btn-sm btn-outline-primary" @click="openDoctorAvailability(d)">Availability</button>
                    <button v-if="d.is_active" class="btn btn-sm btn-outline-danger" @click="blacklistDoctor(d.id)">Blacklist</button>
                    <button v-else class="btn btn-sm btn-outline-success" @click="unblacklistDoctor(d.id)">Undo Blacklist</button>
                    <button class="btn btn-sm btn-outline-dark" @click="deleteDoctor(d.id)">Delete</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card section-card mb-3" v-if="selectedAvailabilityDoctorId !== null">
        <div class="card-body">
          <div class="section-header">
            <div>
              <h3 class="section-title">Doctor Availability - {{ selectedAvailabilityDoctorName }}</h3>
              <p class="section-subtitle">Set availability for the next 7 days.</p>
            </div>
            <span class="soft-chip">Admin action</span>
          </div>
          <div class="availability-row" v-for="(row, index) in availabilityRows" :key="row.date">
            <div class="row-label d-flex justify-content-between align-items-center gap-2 flex-wrap">
              <span>{{ row.date }}</span>
            </div>
            <div class="row g-2">
              <div class="col-md-2"><input class="form-control form-control-sm" :value="row.date" readonly /></div>
              <div class="col-md-2"><input type="time" class="form-control form-control-sm" v-model="row.morning_start" /></div>
              <div class="col-md-2"><input type="time" class="form-control form-control-sm" v-model="row.morning_end" /></div>
              <div class="col-md-2"><input type="time" class="form-control form-control-sm" v-model="row.evening_start" /></div>
              <div class="col-md-2"><input type="time" class="form-control form-control-sm" v-model="row.evening_end" /></div>
              <div class="col-md-2 d-flex align-items-stretch"><button class="btn btn-primary btn-sm w-100" @click="copyPrevious(index)">Use previous</button></div>
            </div>
          </div>
          <div class="compact-actions mt-3">
            <button class="btn btn-primary" @click="saveDoctorAvailability">Save Availability</button>
            <button class="btn btn-outline-secondary" @click="clearDoctorAvailabilityPanel">Close</button>
          </div>
        </div>
      </div>

      <div class="card section-card mb-3">
        <div class="card-body">
          <div class="section-header">
            <div>
              <h3 class="section-title">{{ editingPatientId ? 'Edit Patient' : 'Add Patient' }}</h3>
              <p class="section-subtitle">{{ editingPatientId ? 'Update selected patient profile details.' : 'Register a patient account directly from admin panel.' }}</p>
            </div>
            <span class="soft-chip">Admin action</span>
          </div>
          <div class="dashboard-grid two-col">
            <input v-model="patientForm.name" class="form-control" placeholder="Full Name" />
            <input v-model="patientForm.email" class="form-control" placeholder="Email" :disabled="editingPatientId !== null" />
            <input v-model="patientForm.temp_password" class="form-control" placeholder="Temp Password" :disabled="editingPatientId !== null" />
            <input v-model="patientForm.contact" class="form-control" placeholder="Contact" />
            <input v-model="patientForm.date_of_birth" type="date" class="form-control" />
            <input v-model="patientForm.address" class="form-control" placeholder="Address" />
          </div>
          <div class="compact-actions mt-3">
            <button class="btn btn-primary" @click="addOrUpdatePatient">{{ editingPatientId ? 'Update Patient' : 'Add Patient' }}</button>
            <button class="btn btn-outline-secondary" @click="resetPatientForm">{{ editingPatientId ? 'Cancel Edit' : 'Clear Form' }}</button>
          </div>
        </div>
      </div>

      <div class="card section-card mb-3">
        <div class="card-body table-responsive">
          <div class="section-header">
            <div>
              <h3 class="section-title">Patients</h3>
              <p class="section-subtitle">Review or blacklist patient accounts.</p>
            </div>
          </div>
          <table class="table table-sm table-bordered align-middle">
            <thead><tr><th>Name</th><th>Email</th><th>Contact</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              <tr v-for="p in state.admin.patients" :key="p.id">
                <td>{{ p.name }}</td><td>{{ p.email }}</td><td>{{ p.contact }}</td>
                <td><span class="badge" :class="p.is_active ? 'text-bg-success' : 'text-bg-secondary'">{{ p.is_active ? 'Active' : 'Blacklisted' }}</span></td>
                <td>
                  <div class="compact-actions">
                    <button class="btn btn-sm btn-outline-warning" @click="startEditPatient(p)">Edit</button>
                    <button class="btn btn-sm btn-outline-primary" @click="viewPatientHistory(p)">Treatment History</button>
                    <button v-if="p.is_active" class="btn btn-sm btn-outline-danger" @click="blacklistPatient(p.id)">Blacklist</button>
                    <button v-else class="btn btn-sm btn-outline-success" @click="unblacklistPatient(p.id)">Undo Blacklist</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div v-if="selectedPatientHistory" class="card section-card mb-3">
        <div class="card-body table-responsive">
          <div class="section-header">
            <div>
              <h3 class="section-title">Treatment History - {{ selectedPatientHistory.patient.name }}</h3>
              <p class="section-subtitle">Complete appointment and treatment trail for selected patient.</p>
            </div>
          </div>
          <table class="table table-sm table-bordered align-middle">
            <thead><tr><th>Date</th><th>Doctor</th><th>Department</th><th>Status</th><th>Diagnosis</th><th>Prescription</th><th>Notes</th></tr></thead>
            <tbody>
              <tr v-for="r in selectedPatientHistory.records" :key="r.appointment_id">
                <td>{{ r.date }} {{ r.time_slot }}</td>
                <td>{{ r.doctor_name }}</td>
                <td>{{ r.department }}</td>
                <td>{{ r.status }}</td>
                <td>{{ r.diagnosis || '-' }}</td>
                <td>{{ r.prescription || '-' }}</td>

  <script>
    const Login = {
      template: '#login-template',
      data() { return { form: { username: '', password: '' } }; },
      methods: {
        submit() { this.$emit('login', { ...this.form }); }
      }
    };

    const Register = {
      template: '#register-template',
      props: ['api'],
      data() {
        return { form: { username: '', email: '', password: '', name: '', contact: '', date_of_birth: '', address: '' } };
      },
      methods: {
        async submit() { await this.api({ method: 'POST', path: '/api/auth/register', body: this.form, message: 'Registered successfully. Please login.' }); this.$emit('register'); }
      }
    };

    const AdminDashboard = {
      template: '#admin-template',
      props: ['state', 'api'],
      data() {
        return {
          doctorForm: { name: '', email: '', temp_password: '', specialization: '', department_id: null, experience_years: 0, bio: '' },
          patientForm: { name: '', email: '', temp_password: '', contact: '', date_of_birth: '', address: '' },
          search: { type: 'both', q: '' },
          editingDoctorId: null,
          editingPatientId: null,
          selectedAvailabilityDoctorId: null,
          selectedAvailabilityDoctorName: '',
          availabilityRows: [],
          selectedAppointment: null,
          selectedPatientHistory: null
        };
      },
      mounted() { this.$emit('load-admin'); },
      methods: {
        async addDoctor() {
          const isEditing = !!this.editingDoctorId;
          const path = isEditing ? `/api/admin/doctors/${this.editingDoctorId}` : '/api/admin/doctors';
          const method = isEditing ? 'PUT' : 'POST';

          const payload = {
            name: this.doctorForm.name,
            specialization: this.doctorForm.specialization,
            department_id: this.doctorForm.department_id,
            experience_years: this.doctorForm.experience_years,
            bio: this.doctorForm.bio || ''
          };

          if (!isEditing) {
            payload.email = this.doctorForm.email;
            payload.temp_password = this.doctorForm.temp_password;
          }

          const ok = await this.api({ method, path, body: payload, message: isEditing ? 'Doctor updated' : 'Doctor added' });
          if (ok !== false) {
            this.resetDoctorForm();
            this.$emit('load-admin');
          }
        },
        resetDoctorForm() {
          this.editingDoctorId = null;
          this.selectedAvailabilityDoctorId = null;
          this.selectedAvailabilityDoctorName = '';
          this.availabilityRows = [];
          this.doctorForm = {
            name: '',
            email: '',
            temp_password: '',
            specialization: '',
            department_id: null,
            experience_years: 0,
            bio: ''
          };
        },
        async addOrUpdatePatient() {
          const isEditing = !!this.editingPatientId;
          const path = isEditing ? `/api/admin/patients/${this.editingPatientId}` : '/api/admin/patients';
          const method = isEditing ? 'PUT' : 'POST';

          const payload = {
            name: this.patientForm.name,
            contact: this.patientForm.contact,
            date_of_birth: this.patientForm.date_of_birth,
            address: this.patientForm.address
          };
          if (!isEditing) {
            payload.email = this.patientForm.email;
            payload.temp_password = this.patientForm.temp_password;
          }

          const ok = await this.api({ method, path, body: payload, message: isEditing ? 'Patient updated' : 'Patient added' });
          if (ok !== false) {
            this.resetPatientForm();
            this.$emit('load-admin');
          }
        },
        resetPatientForm() {
          this.editingPatientId = null;
          this.patientForm = { name: '', email: '', temp_password: '', contact: '', date_of_birth: '', address: '' };
        },
        startEditPatient(p) {
          this.editingPatientId = p.id;
          this.patientForm = {
            name: p.name || '',
            email: p.email || '',
            temp_password: '',
            contact: p.contact || '',
            date_of_birth: p.date_of_birth || '',
            address: p.address || ''
          };
          this.state.info = `Editing patient #${p.id}`;
        },
        async viewPatientHistory(p) {
          const data = await this.api({ method: 'GET', path: `/api/admin/patients/${p.id}/treatment-history` });
          if (data !== false) this.selectedPatientHistory = data;
        },
        async blacklistDoctor(id) {
          const ok = await this.api({ method: 'DELETE', path: `/api/admin/doctors/${id}`, message: 'Doctor blacklisted' });
          if (ok !== false) this.$emit('load-admin');
        },
        async unblacklistDoctor(id) {
          const ok = await this.api({ method: 'PUT', path: `/api/admin/doctors/${id}/unblacklist`, message: 'Doctor unblacklisted' });
          if (ok !== false) this.$emit('load-admin');
        },
        async deleteDoctor(id) {
          const ok = await this.api({ method: 'DELETE', path: `/api/admin/doctors/${id}/delete`, message: 'Doctor deleted' });
          if (ok !== false) this.$emit('load-admin');
        },
        async blacklistPatient(id) {
          const ok = await this.api({ method: 'DELETE', path: `/api/admin/patients/${id}`, message: 'Patient blacklisted' });
          if (ok !== false) this.$emit('load-admin');
        },
        async unblacklistPatient(id) {
          const ok = await this.api({ method: 'PUT', path: `/api/admin/patients/${id}/unblacklist`, message: 'Patient unblacklisted' });
          if (ok !== false) this.$emit('load-admin');
        },
        startEditDoctor(d) {
          this.editingDoctorId = d.id;
          this.doctorForm = {
            name: d.name || '',
            email: d.email || '',
            temp_password: '',
            specialization: d.specialization || '',
            department_id: d.department_id || null,
            experience_years: d.experience_years || 0,
            bio: d.bio || ''
          };
          this.state.info = `Editing doctor #${d.id}`;
        },
        openDoctorAvailability(d) {
          this.selectedAvailabilityDoctorId = d.id;
          this.selectedAvailabilityDoctorName = d.name;
          this.loadDoctorAvailability();
        },
        clearDoctorAvailabilityPanel() {
          this.selectedAvailabilityDoctorId = null;
          this.selectedAvailabilityDoctorName = '';
          this.availabilityRows = [];
        },
        seedAvailability() {
          this.availabilityRows = [];
          const now = new Date();
          for (let i = 0; i <= 6; i += 1) {
            const d = new Date(now);
            d.setDate(now.getDate() + i);
            this.availabilityRows.push({ date: d.toISOString().slice(0, 10), morning_start: '', morning_end: '', evening_start: '', evening_end: '' });
          }
        },
        copyPrevious(index) {
          if (index <= 0) return;
          const previous = this.availabilityRows[index - 1];
          const current = this.availabilityRows[index];
          current.morning_start = previous.morning_start;
          current.morning_end = previous.morning_end;
          current.evening_start = previous.evening_start;
          current.evening_end = previous.evening_end;
        },
        async loadDoctorAvailability() {
          if (!this.selectedAvailabilityDoctorId) return;
          this.seedAvailability();
          const data = await this.api({ method: 'GET', path: `/api/admin/doctors/${this.selectedAvailabilityDoctorId}/availability` });
          if (Array.isArray(data)) {
            data.forEach((r) => {
              const row = this.availabilityRows.find((x) => x.date === r.date);
              if (row) Object.assign(row, r);
            });
          }
        },
        async saveDoctorAvailability() {
          if (!this.selectedAvailabilityDoctorId) return;
          const ok = await this.api({
            method: 'POST',
            path: `/api/admin/doctors/${this.selectedAvailabilityDoctorId}/availability`,
            body: { availability: this.availabilityRows },
            message: 'Doctor availability updated'
          });
          if (ok !== false) this.$emit('load-admin');
        },
        async searchEntity() {
          const data = await this.api({ method: 'GET', path: `/api/admin/search?type=${this.search.type}&q=${encodeURIComponent(this.search.q)}` });
          if (Array.isArray(data)) this.state.admin.searchResults = data;
        },
        async viewAppointment(a) {
          const details = await this.api({ method: 'GET', path: `/api/admin/appointments/${a.id}` });
          if (details !== false) {
            this.selectedAppointment = details || a;
            this.state.info = `Loaded appointment #${a.id}`;
          }
        },
        async setAppointmentStatus(id, status) {
          const ok = await this.api({ method: 'PUT', path: `/api/admin/appointments/${id}/status`, body: { status }, message: `Appointment marked ${status}` });
          if (ok !== false) this.$emit('load-admin');
        }
      }
    };

    const DoctorDashboard = {
      template: '#doctor-template',
      props: ['state', 'api'],
      data() {
        return {
          treatment: { appointment_id: null, diagnosis: '', prescription: '', notes: '', next_visit_date: '' },
          availabilityRows: [],
          selectedHistoryPatientId: null,
          historyRecords: []
        };
      },
      mounted() { this.$emit('load-doctor'); this.seedAvailability(); this.loadAvailability(); },
      methods: {
        seedAvailability() {
          this.availabilityRows = [];
          const now = new Date();
          for (let i = 0; i <= 6; i += 1) {
            const d = new Date(now);
            d.setDate(now.getDate() + i);
            this.availabilityRows.push({ date: d.toISOString().slice(0, 10), morning_start: '', morning_end: '', evening_start: '', evening_end: '' });
          }
        },
        copyPrevious(index) {
          if (index <= 0) return;
          const previous = this.availabilityRows[index - 1];
          const current = this.availabilityRows[index];
          current.morning_start = previous.morning_start;
          current.morning_end = previous.morning_end;
          current.evening_start = previous.evening_start;
          current.evening_end = previous.evening_end;
          this.state.info = `Copied availability from ${previous.date} to ${current.date}`;
        },
        async loadAvailability() {
          const data = await this.api({ method: 'GET', path: '/api/doctor/availability' });
          if (Array.isArray(data)) {
            data.forEach((r) => {
              const row = this.availabilityRows.find((x) => x.date === r.date);
              if (row) Object.assign(row, r);
            });
          }
        },
        async complete(id) { await this.api({ method: 'PUT', path: `/api/doctor/appointments/${id}/complete`, message: 'Marked completed' }); this.$emit('load-doctor'); },
        async cancel(id) { await this.api({ method: 'PUT', path: `/api/doctor/appointments/${id}/cancel`, message: 'Marked cancelled' }); this.$emit('load-doctor'); },
        selectTreatment(id) { this.treatment.appointment_id = id; },
        async saveTreatment() {
          if (!this.treatment.appointment_id || !this.treatment.diagnosis || !this.treatment.prescription) {
            this.state.error = 'Appointment ID, diagnosis, and prescription are required';
            return;
          }
          const result = await this.api({ method: 'POST', path: `/api/doctor/appointments/${this.treatment.appointment_id}/treatment`, body: this.treatment, message: 'Treatment saved' });
          if (result !== false) {
            this.treatment = { appointment_id: null, diagnosis: '', prescription: '', notes: '', next_visit_date: '' };
            this.$emit('load-doctor');
          }
        },
        async history(patientId) {
          const data = await this.api({ method: 'GET', path: `/api/doctor/patients/${patientId}/history` });
          if (Array.isArray(data)) {
            this.selectedHistoryPatientId = patientId;
            this.historyRecords = data;
            this.state.info = `History records: ${data.length}`;
          }
        },
        async saveAvailability() {
          await this.api({ method: 'POST', path: '/api/doctor/availability', body: { availability: this.availabilityRows }, message: 'Availability saved' });
          await this.loadAvailability();
        }
      }
    };

    const PatientDashboard = {
      template: '#patient-template',
      props: ['state', 'api'],
      data() {
        const today = new Date().toISOString().slice(0, 10);
        return {
          preferredDate: today,
          doctorSearch: '',
          booking: { date: today, time_slot: '', department_id: null },
          profile: { name: '', contact: '', date_of_birth: '', address: '' },
          latestTaskId: '',
          exportJob: { task_id: '', state: '', download_link: '', filename: '' },
          selectedDoctor: null,
          availableSlots: [],
          selectedSlot: '',
          selectedMedicalFile: null,
          reschedule: { appointment_id: null, doctor_id: null, date: today, time_slot: '' },
          rescheduleSlots: []
        };
      },
      mounted() { this.$emit('load-patient'); this.findDoctorsByDate(); this.loadMedicalDocuments(); },
      methods: {
        jumpTo(id) {
          const el = document.getElementById(id);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        },
        async refreshOverview() {
          const [dashboard, doctors, upcoming, history, documents] = await Promise.all([
            this.api({ method: 'GET', path: '/api/patient/dashboard' }),
            this.api({ method: 'GET', path: '/api/patient/doctors' }),
            this.api({ method: 'GET', path: '/api/patient/appointments' }),
            this.api({ method: 'GET', path: '/api/patient/history' }),
            this.api({ method: 'GET', path: '/api/patient/medical-documents' })
          ]);
          if (dashboard) {
            this.state.patient.departments = dashboard.departments || [];
            this.state.patient.availability = dashboard.doctor_availability || {};
          }
          if (Array.isArray(doctors)) {
            this.state.patient.availabilityOverview = doctors;
            this.state.patient.availabilityUpdatedAt = new Date().toLocaleTimeString();
          }
          if (Array.isArray(upcoming)) this.state.patient.upcoming = upcoming;
          if (Array.isArray(history)) this.state.patient.history = history;
          if (Array.isArray(documents)) this.state.patient.documents = documents;

          await this.findDoctorsByDate();
          this.state.info = 'Patient dashboard refreshed from latest DB data.';
        },
        async findDoctorsByDate() {
          if (!this.preferredDate) {
            this.state.error = 'Please choose a preferred date first';
            return;
          }
          this.booking.date = this.preferredDate;
          this.selectedDoctor = null;
          this.selectedSlot = '';
          this.availableSlots = [];

          const data = await this.api({
            method: 'GET',
            path: `/api/patient/available-doctors?date=${this.preferredDate}&q=${encodeURIComponent(this.doctorSearch)}`
          });
          if (Array.isArray(data)) {
            this.state.patient.doctors = data;
            if (data.length) await this.chooseDoctor(data[0]);
          }
        },
        async chooseDoctor(doctor) {
          this.selectedDoctor = doctor;
          this.booking.department_id = doctor.department_id || this.booking.department_id;
          this.selectedSlot = '';
          this.state.info = `${doctor.name} - ${doctor.specialization} (${doctor.department})`;
          await this.loadSlotsForDoctor();
        },
        async loadSlotsForDoctor() {
          if (!this.selectedDoctor || !this.preferredDate) return;
          const data = await this.api({
            method: 'GET',
            path: `/api/patient/doctors/${this.selectedDoctor.id}/available-slots?date=${this.preferredDate}`
          });
          if (data && Array.isArray(data.available_slots)) {
            this.availableSlots = data.available_slots;
            if (!this.availableSlots.includes(this.selectedSlot)) this.selectedSlot = '';
          }
        },
        async bookSelected() {
          if (!this.selectedDoctor || !this.selectedSlot || !this.preferredDate) {
            this.state.error = 'Choose date, doctor, and available time before booking';
            return;
          }
          const payload = {
            doctor_id: this.selectedDoctor.id,
            department_id: this.selectedDoctor.department_id,
            date: this.preferredDate,
            time_slot: this.selectedSlot
          };
          const res = await this.api({ method: 'POST', path: '/api/patient/appointments', body: payload, message: 'Appointment booked' });
          if (res !== false) {
            this.selectedSlot = '';
            await this.findDoctorsByDate();
            this.$emit('load-patient');
          }
        },
        async cancel(id) { await this.api({ method: 'DELETE', path: `/api/patient/appointments/${id}`, message: 'Appointment cancelled' }); this.$emit('load-patient'); },
        startReschedule(appointment) {
          this.reschedule = {
            appointment_id: appointment.id,
            doctor_id: appointment.doctor_id,
            date: appointment.date,
            time_slot: ''
          };
          this.rescheduleSlots = [];
          this.loadRescheduleSlots();
        },
        clearReschedule() {
          this.reschedule = { appointment_id: null, doctor_id: null, date: new Date().toISOString().slice(0, 10), time_slot: '' };
          this.rescheduleSlots = [];
        },
        async loadRescheduleSlots() {
          if (!this.reschedule.doctor_id || !this.reschedule.date) return;
          const data = await this.api({
            method: 'GET',
            path: `/api/patient/doctors/${this.reschedule.doctor_id}/available-slots?date=${this.reschedule.date}`
          });
          if (data && Array.isArray(data.available_slots)) {
            this.rescheduleSlots = data.available_slots;
            if (!this.rescheduleSlots.includes(this.reschedule.time_slot)) this.reschedule.time_slot = '';
          }
        },
        async confirmReschedule() {
          if (!this.reschedule.appointment_id || !this.reschedule.date || !this.reschedule.time_slot) {
            this.state.error = 'Please choose a new date and slot';
            return;
          }
          const ok = await this.api({
            method: 'PUT',
            path: `/api/patient/appointments/${this.reschedule.appointment_id}`,
            body: { date: this.reschedule.date, time_slot: this.reschedule.time_slot },
            message: 'Appointment rescheduled'
          });
          if (ok !== false) {
            this.clearReschedule();
            await this.findDoctorsByDate();
            this.$emit('load-patient');
          }
        },
        async saveProfile() { await this.api({ method: 'PUT', path: '/api/patient/profile', body: this.profile, message: 'Profile updated' }); },
        onMedicalFileChange(event) {
          const files = event.target.files || [];
          this.selectedMedicalFile = files.length ? files[0] : null;
        },
        async uploadMedicalDocument() {
          if (!this.selectedMedicalFile) {
            this.state.error = 'Please choose a file first';
            return;
          }
          const formData = new FormData();
          formData.append('file', this.selectedMedicalFile);
          const ok = await this.api({ method: 'POST', path: '/api/patient/medical-documents', body: formData, message: 'Medical document uploaded' });
          if (ok !== false) {
            this.selectedMedicalFile = null;
            await this.loadMedicalDocuments();
          }
        },
        async loadMedicalDocuments() {
          const docs = await this.api({ method: 'GET', path: '/api/patient/medical-documents' });
          if (Array.isArray(docs)) this.state.patient.documents = docs;
        },
        async downloadMedicalDocument(url) {
          if (!url) return;
          try {
            const res = await fetch(url, { headers: { Authorization: `Bearer ${this.state.token}` } });
            if (!res.ok) {
              this.state.error = 'Unable to download document';
              return;
            }
            const blob = await res.blob();
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = '';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);
          } catch (err) {
            this.state.error = `Download failed: ${err.message || 'Network error'}`;
          }
        },
        async exportCsv() {
          const data = await this.api({ method: 'GET', path: '/api/patient/export-csv', message: 'CSV export started. Preparing file...' });
          if (!(data && data.task_id)) return;

          this.latestTaskId = data.task_id;
          this.exportJob = { task_id: data.task_id, state: 'PENDING', download_link: '', filename: '' };
          const maxPolls = 20;

          for (let i = 0; i < maxPolls; i++) {
            await new Promise((resolve) => setTimeout(resolve, 1500));
            const status = await this.api({ method: 'GET', path: `/api/patient/export-csv/status/${this.latestTaskId}` });
            if (!status || !status.state) continue;

            this.exportJob.state = status.state;

            if (status.state === 'PENDING' || status.state === 'STARTED' || status.state === 'RETRY') {
              this.state.info = `CSV Task ${status.state}...`;
              continue;
            }

            if (status.state === 'SUCCESS') {
              const link = status.download_link || (status.result && status.result.download_link);
              const filename = (status.result && status.result.filename) || '';
              if (link) {
                this.exportJob.download_link = link;
                this.exportJob.filename = filename;
                this.downloadExport(link);
                this.state.info = 'CSV export completed. Download started.';
              } else {
                this.state.info = 'CSV export completed, but no download link was returned.';
              }
              return;
            }

            if (status.state === 'FAILURE') {
              this.state.error = `CSV export failed: ${status.error || 'Unknown error'}`;
              return;
            }

            this.state.info = `CSV Task ${status.state}.`;
          }

          this.state.error = 'CSV export is taking longer than expected. Please try again in a few seconds.';
        },
        downloadExport(link) {
          if (!link) return;
          const a = document.createElement('a');
          a.href = link;
          a.download = '';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }
      }
    };

    const app = Vue.createApp({
      data() {
        return {
          state: {
            token: null,
            user: null,
            view: 'login',
            error: '',
            info: '',
            admin: { summary: {}, doctors: [], patients: [], appointments: [], departments: [], searchResults: [] },
            doctor: { upcoming: [], patients: [] },
            patient: { departments: [], doctors: [], availability: {}, availabilityOverview: [], upcoming: [], history: [], documents: [], availabilityUpdatedAt: '' }
          },
          refreshTimer: null
        };
      },
      computed: {
        currentComponent() {
          if (this.state.view === 'register') return Register;
          if (this.state.view === 'admin') return AdminDashboard;
          if (this.state.view === 'doctor') return DoctorDashboard;
          if (this.state.view === 'patient') return PatientDashboard;
          return Login;
        }
      },
      methods: {
        async api({ method, path, body, message, clearInfo = false }) {
          this.state.error = '';
          if (clearInfo) this.state.info = '';
          const headers = {};
          if (this.state.token) headers.Authorization = `Bearer ${this.state.token}`;

          const isFormData = typeof FormData !== 'undefined' && body instanceof FormData;
          if (!isFormData) headers['Content-Type'] = 'application/json';

          try {
            const res = await fetch(path, { method, headers, body: body ? (isFormData ? body : JSON.stringify(body)) : undefined });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              this.state.error = data.error || `Request failed (${res.status})`;
              return false;
            }
            if (message) this.state.info = message;
            return data;
          } catch (err) {
            this.state.error = `Network error: ${err.message || 'Unable to reach server'}`;
            return false;
          }
        },
        startAutoRefresh() {
          this.stopAutoRefresh();
          const map = { admin: this.loadAdminData, doctor: this.loadDoctorData, patient: this.loadPatientData };
          const loader = map[this.state.view];
          if (!loader) return;
          this.refreshTimer = setInterval(() => loader.call(this), 10000);
        },
        stopAutoRefresh() {
          if (this.refreshTimer) {
            clearInterval(this.refreshTimer);
            this.refreshTimer = null;
          }
        },
        async onLogin(form) {
          const data = await this.api({ method: 'POST', path: '/api/auth/login', body: form });
          if (!data) return;
          this.state.token = data.access_token;
          this.state.user = data.user;
          if (data.user.role === 'admin') { this.state.view = 'admin'; await this.loadAdminData(); }
          if (data.user.role === 'doctor') { this.state.view = 'doctor'; await this.loadDoctorData(); }
          if (data.user.role === 'patient') { this.state.view = 'patient'; await this.loadPatientData(); }
          this.startAutoRefresh();
        },
        registerPatient() { this.state.view = this.state.view === 'register' ? 'login' : 'register'; },
        logout() {
          this.stopAutoRefresh();
          this.state.token = null;
          this.state.user = null;
          this.state.view = 'login';
          this.state.error = '';
          this.state.info = 'Logged out';
        },
        async loadAdminData() {
          const [summary, doctors, patients, appointments, departments] = await Promise.all([
            this.api({ method: 'GET', path: '/api/admin/dashboard' }),
            this.api({ method: 'GET', path: '/api/admin/doctors' }),
            this.api({ method: 'GET', path: '/api/admin/patients' }),
            this.api({ method: 'GET', path: '/api/admin/appointments' }),
            this.api({ method: 'GET', path: '/api/admin/departments' })
          ]);
          if (summary) this.state.admin.summary = summary;
          if (Array.isArray(doctors)) this.state.admin.doctors = doctors;
          if (Array.isArray(patients)) this.state.admin.patients = patients;
          if (Array.isArray(appointments)) this.state.admin.appointments = appointments;
          if (Array.isArray(departments)) this.state.admin.departments = departments;
        },
        async loadDoctorData() {
          const dashboard = await this.api({ method: 'GET', path: '/api/doctor/dashboard' });
          if (dashboard) {
            this.state.doctor.upcoming = dashboard.upcoming_appointments || [];
            this.state.doctor.patients = dashboard.assigned_patients || [];
          }
        },
        async loadPatientData() {
          const [dashboard, doctors, upcoming, history, documents] = await Promise.all([
            this.api({ method: 'GET', path: '/api/patient/dashboard' }),
            this.api({ method: 'GET', path: '/api/patient/doctors' }),
            this.api({ method: 'GET', path: '/api/patient/appointments' }),
            this.api({ method: 'GET', path: '/api/patient/history' }),
            this.api({ method: 'GET', path: '/api/patient/medical-documents' })
          ]);
          if (dashboard) {
            this.state.patient.departments = dashboard.departments || [];
            this.state.patient.availability = dashboard.doctor_availability || {};
          }
          if (Array.isArray(doctors)) {
            this.state.patient.availabilityOverview = doctors;
            this.state.patient.availabilityUpdatedAt = new Date().toLocaleTimeString();
          }
          if (Array.isArray(upcoming)) this.state.patient.upcoming = upcoming;
          if (Array.isArray(history)) this.state.patient.history = history;
          if (Array.isArray(documents)) this.state.patient.documents = documents;
        }
      },
      beforeUnmount() { this.stopAutoRefresh(); }
    });

    app.mount('#app');
  </script>
</body>
